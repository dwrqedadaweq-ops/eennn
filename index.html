<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status</title>
    <style>
        body {
            background-color: #000000;
            color: #ededed;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* The single clean status pill */
        .status-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: #111111;
            border: 1px solid #222222;
            border-radius: 99px;
            font-size: 14px;
            font-weight: 500;
            cursor: default;
            position: relative;
            transition: border-color 0.2s;
        }

        .status-pill:hover {
            border-color: #444444;
        }

        /* Minimalist indicator dots */
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot-wait { background-color: #555555; }
        .dot-ok { background-color: #2ecc71; }
        .dot-fail { background-color: #e74c3c; }

        /* Sleek dropdown for errors */
        .details-card {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            top: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%) translateY(-5px);
            background: #111111;
            border: 1px solid #222222;
            border-radius: 8px;
            padding: 16px;
            width: max-content;
            font-size: 13px;
            color: #a0a0a0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transition: all 0.2s ease;
            z-index: 10;
        }

        .status-pill:hover .details-card {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .fail-item {
            color: #e74c3c;
            margin-bottom: 6px;
        }
        
        .fail-item:last-child { margin-bottom: 0; }
        
        .ok-text { color: #888888; }
    </style>
</head>
<body>

    <div class="status-pill" id="main-badge">
        <div class="dot dot-wait" id="status-dot"></div>
        <span id="main-text">Main Game</span>
        
        <div class="details-card" id="details-box">
            Awaiting connection...
        </div>
    </div>

    <script>
        const targetId = new URLSearchParams(window.location.search).get('id');
        const dot = document.getElementById('status-dot');
        const details = document.getElementById('details-box');

        const labelMap = {
            Terrain: "Terrain geometry missing",
            Camera: "CurrentCamera instance unbound",
            PlayerEntity: "Avatar entity not present in Workspace",
            Gravity: "Physics gravity uninitialized",
            Bounds: "FallenPartsDestroyHeight undefined",
            GameTick: "Server processing loop frozen",
            Streaming: "Instance streaming context failed",
            WindPhysics: "Global wind physics uninitialized"
        };

        function update() {
            if (!targetId) {
                dot.className = "dot dot-fail";
                details.innerHTML = "Invalid connection token.";
                return;
            }

            fetch(`/api/status?id=${targetId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        dot.className = "dot dot-fail";
                        details.innerHTML = "Instance disconnected.";
                        return;
                    }

                    const s = data.status;
                    let failures = [];

                    // Check all keys against our map
                    for (const [key, msg] of Object.entries(labelMap)) {
                        if (s[key] === false) failures.push(msg);
                    }

                    if (failures.length > 0) {
                        dot.className = "dot dot-fail";
                        details.innerHTML = failures.map(f => `<div class="fail-item">• ${f}</div>`).join('');
                    } else {
                        dot.className = "dot dot-ok";
                        details.innerHTML = `<span class="ok-text">All Workspace systems nominal.<br><br>Sync: ${data.lastUpdated}</span>`;
                    }
                })
                .catch(() => {
                    dot.className = "dot dot-fail";
                    details.innerHTML = "API routing error.";
                });
        }

        if (targetId) {
            update();
            setInterval(update, 2000);
        } else {
            update();
        }
    </script>
</body>
</html>
