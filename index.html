<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Fleet Ops</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .header { margin-bottom: 40px; text-align: center; }
        .header h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -1px; }
        .header p { color: #94a3b8; margin-top: 8px; font-family: monospace; }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .metric {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #1e293b;
            transition: transform 0.2s;
        }

        .metric:hover { transform: translateY(-2px); }
        .metric-title { color: #94a3b8; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;}
        
        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .online { background: rgba(16, 185, 129, 0.1); color: #34d399; box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); border: 1px solid #059669; }
        .offline { background: rgba(239, 68, 68, 0.1); color: #f87171; box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); border: 1px solid #dc2626; }

        .server-list-item {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: #1e293b;
            border-radius: 8px;
            margin-bottom: 10px;
            text-decoration: none;
            color: white;
            border: 1px solid #334155;
        }
        .server-list-item:hover { border-color: #6366f1; }
        .id-text { font-family: monospace; color: #818cf8; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Instance Monitor</h1>
        <p id="subtitle">Initializing link...</p>
    </div>

    <div class="container" id="app-content"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const specificServerId = urlParams.get('id');
        const contentDiv = document.getElementById('app-content');
        const subtitle = document.getElementById('subtitle');

        function createStatusBadge(isOk) {
            return `<span class="status-badge ${isOk ? 'online' : 'offline'}">${isOk ? 'OPERATIONAL' : 'FAILURE'}</span>`;
        }

        function renderSpecificServer(data) {
            if (data.error) {
                subtitle.textContent = "Error 404";
                contentDiv.innerHTML = `<div class="card" style="text-align: center; color: #f87171;"><h2>${data.error}</h2><br><a href="/" style="color: #818cf8;">Return Home</a></div>`;
                return;
            }

            subtitle.textContent = `Target: ${specificServerId}`;
            
            const checks = ['Terrain', 'Lighting', 'Storage', 'Players'];
            let gridHtml = '';
            
            checks.forEach(check => {
                gridHtml += `
                    <div class="metric">
                        <div class="metric-title">${check}</div>
                        ${createStatusBadge(data.status[check])}
                    </div>
                `;
            });

            contentDiv.innerHTML = `
                <div class="card">
                    <h2 style="font-size: 1.2rem; margin-bottom: 10px;">System Integrity</h2>
                    <div class="grid">${gridHtml}</div>
                    <div style="margin-top: 30px; text-align: center;">
                        <a href="/" style="color: #94a3b8; text-decoration: none; border-bottom: 1px dashed;">← Back to Fleet</a>
                    </div>
                </div>
            `;
        }

        function renderServerList(data) {
            subtitle.textContent = "Global Fleet View";
            const serverIds = Object.keys(data);
            
            if (serverIds.length === 0) {
                contentDiv.innerHTML = `<div class="card" style="text-align: center; color: #94a3b8;">No active instances detected. Awaiting uplink...</div>`;
                return;
            }

            let listHtml = '<div class="card"><h2>Active Links</h2><br>';
            serverIds.forEach(id => {
                listHtml += `
                    <a href="/?id=${id}" class="server-list-item">
                        <span class="id-text">${id}</span>
                        <span style="color: #34d399;">● Live</span>
                    </a>
                `;
            });
            listHtml += '</div>';
            contentDiv.innerHTML = listHtml;
        }

        fetch('/api/status' + (specificServerId ? `?id=${specificServerId}` : ''))
            .then(res => res.json())
            .then(data => {
                if (specificServerId) renderSpecificServer(data);
                else renderServerList(data);
            })
            .catch(() => subtitle.textContent = "Network Error");
    </script>
</body>
</html>
