<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Uplink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at top left, #1a1a24 0%, #09090d 100%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* The Frosted Glass Container */
        .glass-panel {
            background: rgba(20, 20, 28, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 640px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .target-id {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #888;
            font-family: monospace;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* The 2-Column Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        /* Individual Status Cards */
        .card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-name {
            font-size: 14px;
            font-weight: 500;
            color: #d1d1d1;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Colors and Glowing Dots */
        .wait { color: #666; }
        .ok { color: #00e676; text-shadow: 0 0 10px rgba(0, 230, 118, 0.3); }
        .fail { color: #ff1744; text-shadow: 0 0 10px rgba(255, 23, 68, 0.3); }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .wait .dot { background: #666; }
        .ok .dot { background: #00e676; box-shadow: 0 0 8px #00e676; }
        .fail .dot { background: #ff1744; box-shadow: 0 0 8px #ff1744; }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #555;
        }

        /* Makes it look good on phones too */
        @media (max-width: 500px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="glass-panel">
        <div class="header">
            <div class="title">Main Game Status</div>
            <div class="target-id" id="target-id">Awaiting Token...</div>
        </div>

        <div class="grid" id="grid-container">
            <div class="card"><span class="card-name">Awaiting Link</span><div class="status wait"><div class="dot"></div>WAIT</div></div>
        </div>

        <div class="footer" id="last-ping">Sync: --:--:--</div>
    </div>

    <script>
        const targetId = new URLSearchParams(window.location.search).get('id');
        const grid = document.getElementById('grid-container');

        // Maps exactly to the Lua script
        const map = {
            Terrain: "Terrain Engine",
            Camera: "Current Camera",
            PlayerEntity: "LocalPlayer Entity",
            Gravity: "Physics Gravity",
            Bounds: "World Bounds",
            GameTick: "Server Tick",
            Streaming: "Instance Streaming",
            WindPhysics: "Global Wind"
        };

        function createCard(name, isOk) {
            const stateClass = isOk ? 'ok' : 'fail';
            const stateText = isOk ? 'OK' : 'FAIL';
            return `
                <div class="card">
                    <span class="card-name">${name}</span>
                    <div class="status ${stateClass}">
                        <div class="dot"></div>${stateText}
                    </div>
                </div>
            `;
        }

        function updateUI() {
            if (!targetId) {
                document.getElementById('target-id').textContent = "ERROR";
                grid.innerHTML = `<div class="card" style="grid-column: 1 / -1;"><span class="card-name" style="color: #ff1744;">No Token Provided in URL</span></div>`;
                return;
            }

            document.getElementById('target-id').textContent = "ID: " + targetId.substring(0, 10) + "...";

            fetch(`/api/status?id=${targetId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        grid.innerHTML = `<div class="card" style="grid-column: 1 / -1;"><span class="card-name" style="color: #ff1744;">Connection Lost / Script Paused</span></div>`;
                        return;
                    }

                    document.getElementById('last-ping').textContent = "Last Sync: " + data.lastUpdated;

                    let html = "";
                    for (const [key, label] of Object.entries(map)) {
                        html += createCard(label, data.status[key]);
                    }
                    grid.innerHTML = html;
                })
                .catch(() => {
                    grid.innerHTML = `<div class="card" style="grid-column: 1 / -1;"><span class="card-name" style="color: #ff1744;">API Routing Error</span></div>`;
                });
        }

        if (targetId) {
            updateUI();
            setInterval(updateUI, 2000);
        } else {
            updateUI();
        }
    </script>
</body>
</html>
