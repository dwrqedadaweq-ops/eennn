<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instance Health</title>
    <style>
        /* Modern, clean reset and font setup */
        :root {
            --bg: #09090b;
            --card-bg: #18181b;
            --border: #27272a;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --ok: #10b981;
            --fail: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard-container {
            width: 100%;
            max-width: 600px;
        }

        /* Clean Header */
        .header {
            margin-bottom: 32px;
            text-align: left;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .target-id {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            color: var(--text-muted);
            background: var(--card-bg);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            display: inline-block;
            word-break: break-all;
        }

        /* The Data Card */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        /* List Items */
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            transition: background-color 0.2s ease;
        }

        .status-row:last-child {
            border-bottom: none;
        }

        .status-row:hover {
            background: #202024;
        }

        .service-name {
            font-size: 15px;
            font-weight: 500;
        }

        /* Modern Status Badges */
        .badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 9999px;
            letter-spacing: 0.3px;
        }

        .badge-ok {
            background: rgba(16, 185, 129, 0.1);
            color: var(--ok);
        }

        .badge-fail {
            background: rgba(239, 68, 68, 0.1);
            color: var(--fail);
        }

        .badge-loading {
            background: var(--border);
            color: var(--text-muted);
        }

        /* Subtle indicator dots */
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        
        .dot-ok { background-color: var(--ok); }
        .dot-fail { background-color: var(--fail); }
        .dot-loading { background-color: var(--text-muted); }

        /* Footer */
        .footer {
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .status-pulse {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--ok);
            border-radius: 50%;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .error-message {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <h1>Instance Health</h1>
            <div class="target-id" id="target-id">Awaiting Target ID...</div>
        </div>

        <div class="card" id="status-card">
            <div class="status-row">
                <span class="service-name">Establishing Connection...</span>
                <div class="badge badge-loading"><div class="dot dot-loading"></div>WAIT</div>
            </div>
        </div>

        <div class="footer">
            <div class="status-pulse">
                <div class="pulse-dot" id="live-indicator" style="display: none;"></div>
                <span id="connection-status">Connecting to endpoint...</span>
            </div>
            <span id="last-ping">--:--:--</span>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const specificServerId = urlParams.get('id');
        const card = document.getElementById('status-card');

        function createRow(name, isOk) {
            const badgeClass = isOk ? 'badge-ok' : 'badge-fail';
            const dotClass = isOk ? 'dot-ok' : 'dot-fail';
            const text = isOk ? 'Operational' : 'Failing';
            
            return `
            <div class="status-row">
                <span class="service-name">${name}</span>
                <div class="badge ${badgeClass}">
                    <div class="dot ${dotClass}"></div>
                    ${text}
                </div>
            </div>`;
        }

        function updateUI() {
            if (!specificServerId) {
                document.getElementById('target-id').textContent = 'No ID Provided';
                document.getElementById('connection-status').textContent = 'Disconnected';
                card.innerHTML = `<div class="error-message">Please provide a valid ?id= parameter in the URL.</div>`;
                return;
            }

            document.getElementById('target-id').textContent = specificServerId;

            fetch(`/api/status?id=${specificServerId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById('live-indicator').style.display = 'none';
                        document.getElementById('connection-status').textContent = 'Instance Offline';
                        card.innerHTML = `<div class="error-message">${data.error}</div>`;
                        return;
                    }

                    document.getElementById('live-indicator').style.display = 'block';
                    document.getElementById('connection-status').textContent = 'Live Updating';
                    document.getElementById('last-ping').textContent = `Updated: ${data.lastUpdated}`;
                    
                    card.innerHTML = 
                        createRow("Workspace Terrain", data.status.Terrain) +
                        createRow("Lighting Service", data.status.Lighting) +
                        createRow("Replicated Storage", data.status.Storage) +
                        createRow("Player Core", data.status.Players);
                })
                .catch(err => {
                    document.getElementById('live-indicator').style.display = 'none';
                    document.getElementById('connection-status').textContent = 'Network Error';
                    card.innerHTML = `<div class="error-message">Failed to reach API endpoint.</div>`;
                });
        }

        if (specificServerId) {
            updateUI();
            setInterval(updateUI, 2500); // UI checks every 2.5 seconds
        } else {
            updateUI();
        }
    </script>
</body>
</html>
