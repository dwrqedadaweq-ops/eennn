<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Game Monitor</title>
    <style>
        body {
            background-color: #0f0f11;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* The ONE TextLabel */
        .main-label {
            font-size: 32px;
            font-weight: bold;
            cursor: default;
            position: relative;
            padding: 10px 20px;
            border-radius: 8px;
            transition: color 0.3s ease;
        }

        .status-ok { color: #10b981; } /* Green */
        .status-fail { color: #ef4444; } /* Red */
        .status-wait { color: #a1a1aa; } /* Gray */

        /* The Hover Tooltip */
        .tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            top: 130%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #1f1f23;
            color: #e4e4e7;
            text-align: left;
            border-radius: 8px;
            padding: 15px;
            font-size: 14px;
            font-weight: normal;
            white-space: nowrap;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 1px solid #3f3f46;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            z-index: 10;
        }

        /* Arrow pointing up */
        .tooltip::after {
            content: "";
            position: absolute;
            bottom: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: transparent transparent #3f3f46 transparent;
        }

        /* Show tooltip on hover */
        .main-label:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        .fail-text { color: #ef4444; font-weight: bold; }
        .pass-text { color: #10b981; }
    </style>
</head>
<body>

    <div class="main-label status-wait" id="game-label">
        Main Game
        <div class="tooltip" id="tooltip-box">Waiting for executor ping...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('id');
        const label = document.getElementById('game-label');
        const tooltip = document.getElementById('tooltip-box');

        function updateUI() {
            if (!targetId) {
                label.className = "main-label status-fail";
                tooltip.innerHTML = "Error: No ID provided in URL.";
                return;
            }

            fetch(`/api/status?id=${targetId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        label.className = "main-label status-fail";
                        tooltip.innerHTML = "Connection lost or script paused.";
                        return;
                    }

                    const s = data.status;
                    // Check if anything at all failed
                    const hasFailures = !(s.Terrain && s.Camera && s.LocalPlayerChar && s.Gravity && s.FallenBounds && s.GameTick);

                    if (hasFailures) {
                        label.className = "main-label status-fail"; // Turn main text red
                        
                        // Build a list of ONLY what failed
                        let failedList = "<strong>FAILURES DETECTED:</strong><br><br>";
                        if (!s.Terrain) failedList += "<span class='fail-text'>✖ Workspace Terrain missing</span><br>";
                        if (!s.Camera) failedList += "<span class='fail-text'>✖ CurrentCamera broken</span><br>";
                        if (!s.LocalPlayerChar) failedList += "<span class='fail-text'>✖ LocalPlayer Character not in Workspace</span><br>";
                        if (!s.Gravity) failedList += "<span class='fail-text'>✖ Gravity value missing</span><br>";
                        if (!s.FallenBounds) failedList += "<span class='fail-text'>✖ FallenPartsDestroyHeight missing</span><br>";
                        if (!s.GameTick) failedList += "<span class='fail-text'>✖ Game Tick frozen</span><br>";
                        
                        tooltip.innerHTML = failedList;
                    } else {
                        label.className = "main-label status-ok"; // Turn main text green
                        tooltip.innerHTML = "<span class='pass-text'>✔ All Workspace systems operational</span><br><br>Last ping: " + data.lastUpdated;
                    }
                })
                .catch(() => {
                    label.className = "main-label status-fail";
                    tooltip.innerHTML = "Network error. Vercel unreachable.";
                });
        }

        if (targetId) {
            updateUI();
            setInterval(updateUI, 2000); // Check every 2 seconds
        } else {
            updateUI();
        }
    </script>
</body>
</html>
