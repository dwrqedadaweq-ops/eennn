<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM.CORE // OVERWATCH</title>
    <style>
        :root {
            --bg: #050505;
            --panel: #0a0a0f;
            --neon-green: #00ffcc;
            --neon-red: #ff003c;
            --text-main: #e0e0e0;
            --text-muted: #555566;
            --border: #1a1a24;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* CRT Scanline Effect */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .dashboard {
            background: var(--panel);
            width: 900px;
            padding: 40px;
            border: 1px solid var(--border);
            border-top: 3px solid var(--neon-green);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.1);
            position: relative;
            z-index: 10;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px dashed var(--text-muted);
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        .sys-id { color: var(--text-muted); font-size: 12px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .module {
            background: #08080c;
            border: 1px solid var(--border);
            padding: 20px;
            position: relative;
        }

        /* Techy corner brackets */
        .module::before, .module::after {
            content: ''; position: absolute; width: 10px; height: 10px; border: 1px solid var(--text-muted);
        }
        .module::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .module::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .mod-title {
            color: var(--text-muted);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .status-text {
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .ok { color: var(--neon-green); text-shadow: 0 0 15px var(--neon-green); }
        .fail { color: var(--neon-red); text-shadow: 0 0 15px var(--neon-red); }
        .loading { color: var(--text-muted); animation: pulse 1.5s infinite; }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .bg-ok { background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
        .bg-fail { background: var(--neon-red); box-shadow: 0 0 10px var(--neon-red); }
        .bg-loading { background: var(--text-muted); }

        .footer {
            margin-top: 30px;
            text-align: right;
            font-size: 12px;
            color: var(--text-muted);
        }

        .error-screen {
            text-align: center;
            padding: 50px;
            color: var(--neon-red);
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="dashboard" id="main-dash">
        <div class="header">
            <h1>Server Uplink // Overwatch</h1>
            <div class="sys-id" id="target-id">AWAITING TARGET ID...</div>
        </div>

        <div class="grid" id="modules">
            <div class="module">
                <div class="mod-title">SEC-01 // Terrain Engine</div>
                <div class="status-text"><div class="indicator bg-loading"></div><span class="loading">STANDBY</span></div>
            </div>
            <div class="module">
                <div class="mod-title">SEC-02 // Lighting Engine</div>
                <div class="status-text"><div class="indicator bg-loading"></div><span class="loading">STANDBY</span></div>
            </div>
            <div class="module">
                <div class="mod-title">SEC-03 // Replicated Storage</div>
                <div class="status-text"><div class="indicator bg-loading"></div><span class="loading">STANDBY</span></div>
            </div>
            <div class="module">
                <div class="mod-title">SEC-04 // Player Service</div>
                <div class="status-text"><div class="indicator bg-loading"></div><span class="loading">STANDBY</span></div>
            </div>
        </div>

        <div class="footer">
            LAST PING: <span id="last-ping">--:--:--</span>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const specificServerId = urlParams.get('id');
        const modulesDiv = document.getElementById('modules');

        function createModule(title, isOk) {
            const statusClass = isOk ? 'ok' : 'fail';
            const bgClass = isOk ? 'bg-ok' : 'bg-fail';
            const text = isOk ? 'ONLINE' : 'FATAL';
            
            return `
            <div class="module">
                <div class="mod-title">${title}</div>
                <div class="status-text ${statusClass}">
                    <div class="indicator ${bgClass}"></div>
                    ${text}
                </div>
            </div>`;
        }

        function updateUI() {
            if (!specificServerId) {
                document.getElementById('main-dash').innerHTML = `
                    <div class="error-screen">
                        <h2 style="font-size: 40px; margin-bottom: 10px;">NO TARGET ACQUIRED</h2>
                        <p>You must provide a valid ?id= in the URL.</p>
                    </div>`;
                return;
            }

            document.getElementById('target-id').textContent = `TARGET: ${specificServerId}`;

            // Make sure to use your exact Vercel URL here!
            fetch(`https://eennn.vercel.app/api/status?id=${specificServerId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        modulesDiv.innerHTML = `<div style="grid-column: span 2; color: var(--neon-red); text-align: center;">[ SYSTEM ERROR: ${data.error} ]<br>Check if the Lua script is actively running.</div>`;
                        return;
                    }

                    document.getElementById('last-ping').textContent = data.lastUpdated;
                    
                    modulesDiv.innerHTML = 
                        createModule("SEC-01 // Terrain Engine", data.status.Terrain) +
                        createModule("SEC-02 // Lighting Engine", data.status.Lighting) +
                        createModule("SEC-03 // Replicated Storage", data.status.Storage) +
                        createModule("SEC-04 // Player Service", data.status.Players);
                })
                .catch(err => {
                    modulesDiv.innerHTML = `<div style="grid-column: span 2; color: var(--neon-red); text-align: center;">[ NETWORK ERROR ]<br>Failed to connect to API endpoint.</div>`;
                });
        }

        // Loop the UI update every 3 seconds to keep it live
        if (specificServerId) {
            updateUI();
            setInterval(updateUI, 3000); 
        } else {
            updateUI();
        }
    </script>
</body>
</html>
